name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json

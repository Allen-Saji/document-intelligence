[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Evidence-backed technical PDF investigation with production-grade provenance and tenant isolation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "openai>=2.53,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "structlog>=25.4,<26",
  "temporalio>=1.16,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
phase0 = [
  "docling>=2.48,<3",
  "langfuse>=3.3,<4",
  "opensearch-py>=3.0,<4",
  "opentelemetry-exporter-otlp>=1.36,<2",
  "redis>=6.4,<7",
  "sentence-transformers>=5.1,<6",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pillow>=11.3,<12",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["document_intelligence"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["document_intelligence"]
